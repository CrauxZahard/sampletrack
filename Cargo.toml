[package]
name = "sample-tracker"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
rune = { git = "https://github.com/anomalyco/rune.git", rev = "09a7590c4cf58b623636534f674c4ff194357fbd" }
rune-kit = { git = "https://github.com/anomalyco/rune.git", rev = "09a7590c4cf58b623636534f674c4ff194357fbd" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Storage", "Window"] }
